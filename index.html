<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STUDIO PATTI｜合同会社スタジオパッチ</title>
<meta name="description" content="キャラクターを中心としたクリエイティブ。アニメーション制作・キャラクター設計・絵本・メタバース・ドキュメンタリー映像。おばけのパッチくんの部屋から、どうぞ。">
<meta name="theme-color" content="#05030f">
<link rel="icon" href="favicon.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="STUDIO PATTI">
<meta property="og:title" content="STUDIO PATTI｜合同会社スタジオパッチ">
<meta property="og:description" content="キャラクターを中心としたクリエイティブ。パッチくんの部屋の、気になるところをクリックしてね。">
<meta property="og:url" content="https://studiopatti.jp/">
<meta property="og:image" content="https://studiopatti.jp/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --scene-w: 384; --scene-h: 240; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05030f; color: #c9c9d4;
    font-family: system-ui, sans-serif;
  }
  #wrap {
    position: fixed; inset: 0; overflow: hidden;
  }
  #hud { display: none; }   /* 開発用HUDは本番非表示 */
  /* シーン本体。中の座標は全部 384x216 のドット単位で書ける */
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    margin-left: -192px; margin-top: -120px;   /* 拡大率に関係なく必ず画面中央 */
    width: 384px; height: 240px;
    transform-origin: center center;
    image-rendering: pixelated;
    overflow: hidden;
  }
  #stage img, #stage div { image-rendering: pixelated; }

  #room { position: absolute; left: 0; top: 0; width: 384px; height: 240px; }

  /* ゲーム風テキストボックス(将来ここにホバー解説が入る) */
  #talkbox {
    position: absolute; left: 72px; top: 184px;
    width: 242px; height: 30px; box-sizing: border-box;
    background: rgba(8, 6, 40, .92);
    border: 2px solid #e8e4f4; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #2a2560;
    padding: 3px 14px 3px 6px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #f2eefc; font-size: 8px; line-height: 1.4;
  }
  #talkbox .name { color: #fcc800; }
  #talkbox .cursor {
    position: absolute; right: 5px; bottom: 3px;
    width: 0; height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 4px solid #f2eefc;
    animation: tbc 1s steps(1) infinite;
  }
  @keyframes tbc { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  /* ─── 重なり順をここで一元管理(レイヤー事故防止) ─── */
  #room { z-index: 1; }
  #speopclip, #winbars, #garland, #globespin, #jukeglow, #jukehalo, #clockhands, #doorGlowL, #doorGlowR, #signGlowL, #signGlowR, #pcidle, #pcmovie { z-index: 2; }
  .hs, #jukebox { z-index: 3; }
  #mshadow, #mayu, #pshadow, #patti { z-index: 4; }
  #navbar, #talkbox { z-index: 6; }

  /* ─── 上部ナビゲーション ─── */
  #navbar {
    position: absolute; left: 0; top: 0; width: 384px; height: 15px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8, 6, 40, .92); border-bottom: 1px solid #2a2560;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    padding: 0 4px; box-sizing: border-box;
  }
  #navbar .brand { display: flex; align-items: center; }
  #navbar .brand img { height: 10px; width: auto; image-rendering: auto; }
  #navbar nav { display: flex; align-items: center; gap: 0; }
  #navbar nav button {
    border: 0; background: transparent; color: #ffffff; cursor: pointer;
    font-family: inherit; font-size: 6.5px; line-height: 1.1; padding: 1px 7px; text-align: center;
  }
  /* 隣どうしの境目: 暗線+明線の溝彫り(ピクセル1px) */
  #navbar nav button + button {
    border-left: 1px solid #05041c;
    box-shadow: inset 1px 0 0 rgba(118, 110, 200, .3);
  }
  #navbar nav button:hover, #navbar nav button:focus-visible { color: #fcc800; background: rgba(252, 200, 0, .12); outline: none; }

  /* ─── 吊り看板の文字(縦書き) ─── */
  /* 戸口からもれる光(淡いグローが呼吸する) */
  #doorGlowL, #doorGlowR {
    position: absolute; top: 40px; width: 118px; height: 186px;
    pointer-events: none; mix-blend-mode: screen;
    animation: doorbreath 4.6s ease-in-out infinite;
  }
  #doorGlowL {
    left: -18px;
    background: radial-gradient(closest-side at 32% 55%,
      rgba(255, 214, 130, .52) 0%, rgba(255, 186, 80, .26) 45%, rgba(255, 186, 80, 0) 78%);
  }
  #doorGlowR {
    left: 284px; animation-delay: 2.3s;
    background: radial-gradient(closest-side at 68% 55%,
      rgba(255, 188, 222, .5) 0%, rgba(232, 140, 186, .24) 45%, rgba(232, 140, 186, 0) 78%);
  }
  @keyframes doorbreath { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  /* 吊り看板のうしろの淡い光(電飾の呼吸) */
  #signGlowL, #signGlowR {
    position: absolute; top: 14px; height: 40px;
    pointer-events: none; mix-blend-mode: screen;
    animation: doorbreath 4.6s ease-in-out infinite;
  }
  #signGlowL {
    left: -16px; width: 80px; animation-delay: 1.2s;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(255, 214, 130, .34) 0%, rgba(255, 186, 80, .16) 55%, rgba(255, 186, 80, 0) 80%);
  }
  #signGlowR {
    left: 320px; width: 80px; animation-delay: 3.4s;
    background: radial-gradient(closest-side at 50% 50%,
      rgba(255, 178, 216, .36) 0%, rgba(236, 148, 190, .17) 55%, rgba(236, 148, 190, 0) 80%);
  }
  @media (prefers-reduced-motion: reduce) { #doorGlowL, #doorGlowR, #signGlowL, #signGlowR { animation: none; } }

  /* ─── 戸口: 斜めの壁に沿ったクリック形状と光 ─── */
  #doorL { clip-path: polygon(6% 6%, 94% 1%, 94% 72%, 6% 99%); }
  #doorR { clip-path: polygon(9% 1%, 94% 6%, 94% 99%, 9% 72%); }
  #doorR::after {
    background: radial-gradient(closest-side,
      rgba(255, 218, 236, .58) 0%, rgba(236, 148, 190, .34) 40%,
      rgba(186, 88, 140, .12) 70%, rgba(186, 88, 140, 0) 100%);
  }

  /* 地球儀はずっと回っている */
  #globespin {
    position: absolute; left: 92px; top: 113px;
    width: 24px; height: 28px;
    background-image: url(globe_spin.png);
    background-size: 144px 28px;
    animation: globespinanim 2.4s steps(6) infinite;
    pointer-events: none;
  }
  @keyframes globespinanim { from { background-position: 0 0; } to { background-position: -144px 0; } }
  /* 掛け時計の針(リアルタイム・JSが1px線で描く) */
  #clockhands {
    position: absolute; left: 105px; top: 29px;
    width: 38px; height: 38px; pointer-events: none;
    image-rendering: pixelated;
  }
  /* ジュークボックス(本棚の手前) */
  #jukebox {
    position: absolute; left: 50px; top: 110px;
    width: 42px; height: 74px; cursor: pointer;
    border: 0; background: transparent; padding: 0;
  }
  /* 灯りのコマ(消灯時は非表示。再生中=速い点滅／ホバー中=ゆっくり点滅) */
  #jukeglow {
    position: absolute; left: 50px; top: 110px;
    width: 42px; height: 74px; display: none;
    background-image: url(jukebox_glow.png);
    background-size: 168px 74px;
    image-rendering: pixelated; pointer-events: none;
  }
  @keyframes jbglow {
    0%,24.9%   { background-position: 0 0; }
    25%,49.9%  { background-position: -42px 0; }
    50%,74.9%  { background-position: -84px 0; }
    75%,100%   { background-position: -126px 0; }
  }
  #jukehalo {
    position: absolute; left: 38px; top: 98px;
    width: 66px; height: 98px; display: none;
    background: radial-gradient(ellipse at center, rgba(255,170,90,.34), rgba(255,170,90,0) 70%);
    mix-blend-mode: screen; pointer-events: none;
  }
  /* 再生中: チューブと星が速くピカピカ */
  #jukebox.playing ~ #jukeglow { display: block; animation: jbglow .44s steps(1) infinite; }
  #jukebox.playing ~ #jukehalo { display: block; }
  /* ホバー(停止中): 再生中よりゆっくり灯りが点滅する */
  #jukebox:hover:not(.playing) ~ #jukeglow,
  #jukebox:focus-visible:not(.playing) ~ #jukeglow {
    display: block; opacity: .8; animation: jbglow 2.4s steps(1) infinite;
  }
  #jukebox:hover:not(.playing) ~ #jukehalo,
  #jukebox:focus-visible:not(.playing) ~ #jukehalo {
    display: block; animation: jbbreath 2.4s ease-in-out infinite;
  }
  @keyframes jbbreath { 0%,100% { opacity: .3; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #jukeglow, #jukehalo { animation: none !important; }
  }

  /* パッチくんの接地影(足の黒とぶつからない紫) */
  #pshadow {
    position: absolute; width: 22px; height: 5px;
    left: 207px; top: 180px;   /* 読み込み前もパッチの足元に */
    border-radius: 50%; background: rgba(64, 24, 108, .5);
  }
  /* マユちゃん(左で絵本を読んでいる) */
  #mayu {
    position: absolute; left: 96px; top: 126px;
    width: 76px; height: 58px;   /* 足先を描き足した分だけ広い */
    transform: scale(.75); transform-origin: 50% 100%;
    background-image: url(mayu_shaded.png);
    background-repeat: no-repeat;
  }
  #mshadow {
    position: absolute; left: 112px; top: 179px;
    width: 46px; height: 6px;
    border-radius: 50%; background: rgba(64, 24, 108, .5);
  }
  /* 窓の向こうを飛ぶおばけ(Speop)。楕円でクリップして桟の奥に見せる */
  #speopclip {
    position: absolute; left: 251px; top: 17px;
    width: 78px; height: 54px;
    clip-path: ellipse(39px 27px at 39px 27px);
    pointer-events: none;
  }
  #speop {
    position: absolute; left: -30px; top: 18px;
    width: 24px; height: 18px;
    background-image: url(speop.png);
    background-repeat: no-repeat;
  }
  #winbars {
    position: absolute; left: 0; top: 0;
    width: 384px; height: 240px; pointer-events: none;
  }
  /* ガーランドのチラつき(3コマ) */
  #garland {
    position: absolute; left: 0; top: 14px;
    width: 384px; height: 26px;
    background-image: url(garland.png);
    background-size: 1152px 26px;
    animation: garflick 1.35s steps(1) infinite;
  }
  @keyframes garflick {
    0%, 33.3% { background-position: 0 0; }
    33.4%, 66.6% { background-position: -384px 0; }
    66.7%, 100% { background-position: -768px 0; }
  }
  @media (prefers-reduced-motion: reduce) { #garland { animation: none; } }

  /* ─── スマホ(縦持ち)への案内: 横にしてもらう ─── */
  #rotate {
    position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #05030f; padding: 24px;
    font-family: 'DotGothic16', 'MS Gothic', monospace; text-align: center;
  }
  #rotate .phone {
    width: 144px; height: 144px; image-rendering: pixelated;
    background-image: url(rotate_phone.png);
    background-size: 1440px 144px;
    animation: phoneturn 2.6s steps(1) infinite;
  }
  @keyframes phoneturn {
    0%,9.9%    { background-position: 0 0; }
    10%,19.9%  { background-position: -144px 0; }
    20%,29.9%  { background-position: -288px 0; }
    30%,39.9%  { background-position: -432px 0; }
    40%,49.9%  { background-position: -576px 0; }
    50%,59.9%  { background-position: -720px 0; }
    60%,69.9%  { background-position: -864px 0; }
    70%,79.9%  { background-position: -1008px 0; }
    80%,89.9%  { background-position: -1152px 0; }
    90%,100%   { background-position: -1296px 0; }
  }
  #rotate .msg {
    position: relative; max-width: 340px; box-sizing: border-box;
    background: rgba(8, 6, 40, .92);
    border: 2px solid #e8e4f4; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #2a2560;
    padding: 13px 12px 12px 54px; color: #f2eefc;
    font-size: clamp(11px, 3.4vw, 14px); line-height: 1.7; text-align: left;
    white-space: nowrap;   /* 改行は<br>で手で入れた位置だけにする */
  }
  #rotate .msg b {
    color: #fcc800; font-weight: normal; display: block;
    font-size: clamp(12px, 3.9vw, 16px); margin-bottom: 2px;
  }
  #rotate .patti {
    position: absolute; left: 8px; bottom: 6px;
    width: 36px; height: 48px; image-rendering: pixelated;
    background-image: url(patti_shaded.png);
    background-size: 2160px 48px;
    animation: pattiidle 1.2s steps(12) infinite;
  }
  @keyframes pattiidle { from { background-position: 0 0; } to { background-position: -432px 0; } }
  #rotate .anyway {
    background: none; border: 0; color: #8b86a8;
    font-family: inherit; font-size: 12px; text-decoration: underline;
    cursor: pointer; padding: 6px 10px;
  }
  @media (orientation: portrait) and (max-width: 900px) {
    body:not(.seeanyway) #rotate { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    #rotate .phone, #rotate .patti { animation: none; }
    #rotate .phone { background-position: -1296px 0; }
  }

  /* ─── 汎用ホットスポット ─── */
  .hs {
    position: absolute; display: block; cursor: pointer;
    border: 0; background: transparent; padding: 0; border-radius: 0;
  }
  /* ホバー=やわらかい楕円の光がふわっと灯る(四角い切り抜きは一切貼らない) */
  .hs::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: var(--gw, 164%); height: var(--gh, 164%);
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(255,244,214,.74) 0%, rgba(255,224,164,.45) 34%,
      rgba(255,200,120,.18) 60%, rgba(255,184,100,0) 100%);
    mix-blend-mode: screen; pointer-events: none;
    opacity: 0; transition: opacity .2s ease;
  }
  .hs:hover::after, .hs:focus-visible::after { opacity: var(--gi, 1); }
  /* 専用の演出を持つ場所(テレビ/絵本/ギャラリー/PC)は光を重ねない */
  .hs.nobg::after { content: none; }
  @media (prefers-reduced-motion: reduce) { .hs::after { transition: none; } }
  /* COMPANYモニタ: ふだんはスクリーンセーバー、カーソルを合わせると映像が流れる */
  #pcidle, #pcmovie {
    position: absolute; left: 150px; top: 100px;   /* 画面の内側そのもの */
    width: 92px; height: 28px;                     /* = 23:7 (約3.29:1) */
    image-rendering: pixelated; pointer-events: none;
    object-fit: fill;
  }
  #pcmovie { opacity: 0; transition: opacity .2s ease; }
  #pcidle  { opacity: 1; transition: opacity .2s ease; }
  #companylink:hover ~ #pcmovie,
  #companylink:focus-visible ~ #pcmovie { opacity: 1; }
  #companylink:hover ~ #pcidle,
  #companylink:focus-visible ~ #pcidle { opacity: 0; }
  @media (prefers-reduced-motion: reduce) { #pcidle, #pcmovie { transition: none; } }
  /* 月のおばけボンボン(窓の向こう) */
  #bonbon {
    position: absolute; left: 44px; top: 2px;
    width: 32px; height: 32px;
    background-image: url(bonbon_shaded.png);
    background-size: 768px 32px;
    image-rendering: pixelated;
    animation: bonbonanim 2.4s steps(24) infinite;
  }
  @keyframes bonbonanim { from { background-position: 0 0; } to { background-position: -768px 0; } }

  /* ─── ズーム先の詳細ビュー ─── */
  #detail {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(4, 2, 26, .94);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s;
  }
  #detail[hidden] { display: none; }   /* hidden属性を確実に効かせる(全クリック吸収バグの根治) */
  #detail.on { opacity: 1; }
  /* 装飾要素はクリックを一切奪わない */
  #tv, #garland, #mayu, #mshadow, #patti, #pshadow, #room { pointer-events: none; }
  #dwrap {
    position: relative;
    width: min(96vw, 148vh);   /* 画面サイズに応じて収まるように */
    aspect-ratio: 8 / 5;
  }
  #dbg { width: 100%; height: 100%; image-rendering: pixelated; display: block; }
  #dcontent { position: absolute; inset: 0; font-family: 'DotGothic16','MS Gothic',monospace; }
  #dcontent * { box-sizing: border-box; }   /* %パディングで幅が膨らんではみ出すのを根治 */
  #dback {
    position: absolute; left: 1.5%; top: 3%; z-index: 10;
    background: rgba(8,6,40,.92); color: #f2eefc;
    border: 2px solid #e8e4f4; border-radius: 3px;
    font-family: 'DotGothic16','MS Gothic',monospace;
    font-size: clamp(11px, 1.6vw, 16px); padding: 5px 12px; cursor: pointer;
  }
  #dback:hover { background: #fcc800; color: #1c1640; }
  /* ブラウン管効果(丸み・走査線・にじみ) */
  /* チャンネル動画は他社作品なので加工なし(角丸のみ) */
  .crt {
    position: absolute; overflow: hidden; background: #000;
    border-radius: 2% / 3%;
  }
  .crt iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #dcontent iframe, #dcontent img.fit { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #dcontent img.fit { object-fit: contain; background: #05030f; }
  .dpanel { position: absolute; overflow: auto; color: #0a0830; }
  .dpanel h2 { font-size: clamp(13px, 2vw, 20px); margin: 0 0 .5em; }
  .dpanel p { font-size: clamp(10px, 1.45vw, 14px); line-height: 1.7; margin: 0 0 .8em; }
  .chbtn {
    display: block; width: 100%; margin: 0 0 6%;
    background: #1c1640; color: #ffd35e; border: 1px solid #e8e4f4;
    font-family: inherit; font-size: clamp(9px, 1.2vw, 12px); cursor: pointer; padding: 8% 0;
  }
  .chbtn.on { background: #fcc800; color: #1c1640; }
  .navbtn {
    background: rgba(8,6,40,.85); color: #f2eefc; border: 2px solid #e8e4f4;
    border-radius: 3px; font-family: inherit; font-size: clamp(12px, 2vw, 18px);
    cursor: pointer; padding: 2px 10px;
  }
  /* 購入ボタン: 赤ベース。紺の壁と真鍮プレートの中で一番目を引く色 */
  .buybtn {
    display: flex; align-items: center; justify-content: center; gap: .45em;
    background: linear-gradient(#6b2830, #3d151b);
    color: #dcb2ae; border: 2px solid #240a0f;
    box-shadow: inset 0 1px 0 #8d3f47, 0 2px 0 #1b0508;
    border-radius: 3px; text-decoration: none; box-sizing: border-box;
    font-family: inherit; font-size: clamp(10px, 2vw, 24px);
    cursor: pointer; white-space: nowrap;
    transition: background .18s ease, color .18s ease, border-color .18s ease,
                box-shadow .18s ease, transform .12s ease;
  }
  .buybtn svg {
    width: 1.25em; height: 1.25em; shape-rendering: crispEdges; flex: none;
    filter: brightness(.62) saturate(.5); transition: filter .18s ease;
  }
  /* カーソルを乗せると赤く灯って「押せる」状態になる */
  .buybtn:hover, .buybtn:focus-visible {
    background: linear-gradient(#ff6069, #cc2a39);
    color: #fff3ea; border-color: #5e0e19;
    box-shadow: inset 0 1px 0 #ff9aa2, 0 2px 0 #46080f;
    transform: translateY(-1px); outline: none;
  }
  .buybtn:hover svg, .buybtn:focus-visible svg { filter: none; }
  .buybtn:active { transform: translateY(1px); box-shadow: inset 0 1px 0 #ff9aa2; }
  @media (prefers-reduced-motion: reduce) { .buybtn, .buybtn svg { transition: none; } }
  .letterfield {
    display: block; width: 100%; margin-bottom: 4%;
    background: transparent; border: 0; border-bottom: 1px solid #b9a; color: #0a0830;
    font-family: inherit; font-size: clamp(10px, 1.5vw, 14px); padding: 2px;
  }
  #flyletter {
    position: absolute; width: 12%; height: 8%;
    background: #fdf3e3; border: 1px solid #0a0830; z-index: 5;
    transition: all .9s cubic-bezier(.5,0,.8,1); pointer-events: none;
  }
  /* パッチくん：コマの切り替えは JS が背景位置を動かす */
  #patti {
    position: absolute;
    width: 36px; height: 48px;
    background-image: url(patti_shaded.png);
    background-repeat: no-repeat;
    left: 200px; top: 136px;   /* GROUND_Y(184) - 48。JS初期値と一致させる */
    transform: scale(.75); transform-origin: 50% 100%;
  }


  #hud { font-size: 13px; letter-spacing: .04em; }
  #hud b { color: #fcc800; font-weight: 500; }
  #toast {

<script>
// ─────────────────────────────────────────────
// 設定：ここだけ触れば動きが変わる
// ─────────────────────────────────────────────
const GROUND_Y   = 184;   // 足の裏が乗る高さ（ドット）※下部はテキストボックス帯
const WALK_MIN_X = 180;   // 歩ける左端(マユちゃんの右から)
const WALK_MAX_X = 284;   // 歩ける右端(赤いポストの手前で止まる)
const WALK_SPEED = 20;    // 歩く速さ（ドット/秒）※歩行コマと同期する速度
const ART_FACES  = 'left';// 描いた絵が向いている方向。'right' なら書き換える

const stage = document.getElementById('stage');
const el    = document.getElementById('patti');
const now   = document.getElementById('now');

// ─────────────────────────────────────────────
// スプライトプレイヤー
// patti.json のタグ情報をそのまま読むので、
// 絵を描き直しても PNG と JSON を差し替えるだけでいい
// ─────────────────────────────────────────────
class Player {
  constructor(el) { this.el = el; this.tag = null; this.i = 0; this.t = 0; this.onEnd = null; this.hud = false; }
  load(data) {
    this.frames = data.frames.map(f => ({ x: f.frame.x, ms: f.duration }));
    this.tags = {};
    for (const t of data.meta.frameTags) this.tags[t.name] = t;
    this.w = data.frames[0].frame.w;
    this.h = data.frames[0].frame.h;
    this.sheetW = data.meta.size.w;
    this.el.style.backgroundSize = `${this.sheetW}px ${this.h}px`;
  }
  // ping-pong / reverse も含めて再生順を組み立てる
  order(tag) {
    const seq = [];
    for (let i = tag.from; i <= tag.to; i++) seq.push(i);
    if (tag.direction === 'reverse') seq.reverse();
    if (tag.direction === 'pingpong' && seq.length > 2) {
      for (let i = seq.length - 2; i > 0; i--) seq.push(seq[i]);
    }
    return seq;
  }
  play(name, { loop = true } = {}) {
    const ALIAS = { walk: 'wolk', wolk: 'walk' };   // タグ名を直しても動くように
    const tag = this.tags[name] || this.tags[ALIAS[name]];
    if (!tag) { console.warn('タグが見つかりません:', name); return Promise.resolve(); }
    this.tag = tag; this.seq = this.order(tag); this.loop = loop;
    this.i = 0; this.t = 0; this.draw();
    if (this.hud) now.textContent = name;
    return new Promise(res => { this.onEnd = res; });
  }
  draw() { this.el.style.backgroundPosition = `-${this.frames[this.seq[this.i]].x}px 0`; }
  tick(dt) {
    if (!this.tag) return;
    this.t += dt;
    const dur = this.frames[this.seq[this.i]].ms;
    if (this.t < dur) return;
    this.t -= dur;
    this.i++;
    if (this.i >= this.seq.length) {
      if (this.loop) { this.i = 0; }
      else { this.i = this.seq.length - 1; const f = this.onEnd; this.onEnd = null; this.tag = null; if (f) f(); return; }
    }
    this.draw();
  }
}

const p = new Player(el);
p.hud = true;
const mp = new Player(document.getElementById('mayu'));   // マユちゃん
let x = 200, facing = 1;   // facing: 1 = 絵のまま, -1 = 左右反転

function place() {
  const xi = Math.round(x);              // 整数スナップでドットのズレ/ジッタを防ぐ
  el.style.left = xi + 'px';
  el.style.top  = (GROUND_Y - p.h) + 'px';
  el.style.transform = facing === 1 ? 'scale(.75)' : 'scale(.75) scaleX(-1)';
  const sh = document.getElementById('pshadow');
  sh.style.left = (xi + 7) + 'px';
  sh.style.top  = (GROUND_Y - 4) + 'px';
}

const wait  = ms => new Promise(r => setTimeout(r, ms));
const rand  = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));

// ─────────────────────────────────────────────
// 行動：ここを書き換えるだけで振る舞いが変わる
// ─────────────────────────────────────────────
async function idleFor(ms) {
  const end = performance.now() + ms;
  p.play('idle');
  while (performance.now() < end) {
    await wait(rand(2800, 6000));
    if (performance.now() >= end) break;
    await p.play('blink', { loop: false });   // たまに1回だけ瞬き
    p.play('idle');
  }
}

async function walkTo(targetX) {
  const dir = targetX > x ? 1 : -1;
  facing = (ART_FACES === 'left') ? (dir > 0 ? -1 : 1) : (dir > 0 ? 1 : -1);
  place();
  p.play('wolk');
  await new Promise(res => {
    let prev = performance.now();
    const step = (t) => {
      const dt = Math.min(100, t - prev);   // タブ復帰時の巨大な差分を潰す
      prev = t;
      x += dir * WALK_SPEED * dt / 1000;    // 実時間で進める（画面のHz依存にしない）
      if ((dir > 0 && x >= targetX) || (dir < 0 && x <= targetX)) { x = targetX; place(); res(); return; }
      place();
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

async function nap() {
  await p.play('sleep_in', { loop: false });
  p.play('sleep');
  await wait(rand(12000, 22000));           // しばらく眠る
  await p.play('sleep_out', { loop: false });
}

async function behave() {
  while (true) {
    await idleFor(rand(6000, 12000));       // しばらく立っている
    for (let i = 0, n = randi(1, 2); i < n; i++) {
      await walkTo(rand(WALK_MIN_X, WALK_MAX_X));
      await idleFor(rand(4000, 9000));
    }
    if (Math.random() < 0.5) await nap();
  }
}

// 窓の向こうをたまーに飛ぶおばけ(Speop / 16コマ 24x18)
async function speopBehave() {
  const el = document.getElementById('speop');
  const N_FRAMES = 16, FW2 = 24;
  el.style.backgroundSize = (N_FRAMES * FW2) + 'px 18px';
  while (true) {
    await wait(rand(9000, 20000));
    const toRight = Math.random() < 0.5;
    const x0 = toRight ? -28 : 82, x1 = toRight ? 82 : -28;
    const y0 = rand(10, 26);
    const dur = rand(5000, 7000);
    const t0 = performance.now();
    await new Promise(res => {
      const step = (t) => {
        const k = Math.min(1, (t - t0) / dur);
        const fx = Math.floor((t - t0) / 100) % N_FRAMES;
        el.style.backgroundPosition = `-${fx * FW2}px 0`;
        el.style.left = Math.round(x0 + (x1 - x0) * k) + 'px';
        el.style.top = Math.round(y0 + 5 * Math.sin(k * 6.28 * 1.5)) + 'px';
        el.style.transform = toRight ? 'scale(.75)' : 'scale(.75) scaleX(-1)';
        if (k >= 1) { res(); return; }
        requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    });
  }
}

// マユちゃん: 基本ずーっと idle、本当にたまーに blink
async function mayuBehave() {
  mp.play('idle');
  while (true) {
    await wait(rand(8000, 16000));
    await mp.play('blink', { loop: false });
    mp.play('idle');
  }
}

// ─────────────────────────────────────────────
// 起動
// ─────────────────────────────────────────────
function fitStage() {
  // PC画面いっぱいに表示する(端数スケール許容・pixelatedなので見た目は保たれる)
  const s = Math.max(0.5, Math.min(window.innerWidth / 384, window.innerHeight / 240));
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
// resize が飛ばない環境(埋め込み/モバイルのURLバー等)でも必ず追従させる
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
document.addEventListener('visibilitychange', fitStage);
setTimeout(fitStage, 400);   // 起動直後にビューポートが確定しない環境への保険
fitStage();   // スプライト読み込みを待たずに即スケール

let last = performance.now();
function loop(t) {
  const dt = Math.min(100, t - last);
  p.tick(dt);
  mp.tick(dt);
  last = t;
  requestAnimationFrame(loop);
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(window._tt);
  window._tt = setTimeout(() => el.style.opacity = '0', 2200);
}

// ─────────────────────────────────────────────
// テキストボックス: ホバーでパッチが解説する(将来ここに項目を足していく)
// ─────────────────────────────────────────────
const talktext = document.getElementById('talktext');
const TALK_DEFAULT = 'ここはスタジオパッチのホームページだよ！<br>気になるところをクリックしてね！';

  const nm = document.querySelector('#talkbox .name');

  talktext.innerHTML = t;
};

  if (e.key === 'Escape' && currentView) closeDetail();
});

  b.addEventListener('focus', () => setTalk(hoverText));

// ─────────────────────────────────────────────
// サイトエンジン: ズーム遷移 + 各詳細ビュー
// ─────────────────────────────────────────────
const CCL_URL = 'https://ikemotodir.github.io/chara-chara-lab/';

const CHANNELS = [
  { t: '3DCG・VFX シネマティック', c: 'Amused Art Japan',
    src: 'https://player.vimeo.com/video/1166568421?title=0&byline=0&portrait=0' },
  { t: '広告・ブランド映像', c: 'Amused Art Japan',
    src: 'https://player.vimeo.com/video/1029119982?title=0&byline=0&portrait=0' },

    src: 'https://www.youtube-nocookie.com/embed/Y3UOLaso-MI?rel=0' },
  { t: '映画劇中アニメーション', c: 'samillia',
    src: 'https://player.vimeo.com/video/1084182206?title=0&byline=0&portrait=0' },
];

let RECTS = {}, BOOK = null, GALLERY = { items: [] };
// ビルドし直した内容が必ず反映されるようキャッシュを避ける
const NOCACHE = { cache: 'no-store' };
fetch('closeups.json', NOCACHE).then(r => r.json()).then(j => RECTS = j).catch(() => {});
let CONTACT = { endpoint: '', fields: {} };   // お問い合わせの送り先(contact.json)
fetch('contact.json', NOCACHE).then(r => r.json()).then(j => CONTACT = j).catch(() => {});

const pctRect = r =>
  `position:absolute;left:${r.x / 384 * 100}%;top:${r.y / 240 * 100}%;` +
  `width:${r.w / 384 * 100}%;height:${r.h / 240 * 100}%;`;
const arr4 = a => ({ x: a[0], y: a[1], w: a[2], h: a[3] });

const dcontent = document.getElementById('dcontent');
const detail = document.getElementById('detail');
const dbg = document.getElementById('dbg');
let currentView = null;

function stageScale() {
  const m = /scale\(([\d.]+)\)/.exec(stage.style.transform || '');
  return m ? parseFloat(m[1]) : 1;
}

function zoomOpen(key, hx, hy, hw, hh) {
  const s = stageScale();
  stage.style.transformOrigin = `${hx + hw / 2}px ${hy + hh / 2}px`;
  stage.style.transition = 'transform .55s cubic-bezier(.45,0,.85,1)';
  stage.style.transform = `scale(${s * 5})`;
  setTimeout(() => {
    showDetail(key, true);
    requestAnimationFrame(() => {          // 詳細画面が乗ってから部屋を戻す
      stage.style.transition = 'none';
      stage.style.transformOrigin = 'center center';
      fitStage();
    });
  }, 540);
}

function showDetail(key, instant = false) {
  currentView = key;
  dbg.src = `closeup_${key}.png`;
  clearTimeout(window._closeT);   // 閉じかけのタイマーが中身を消すのを防ぐ
  dcontent.innerHTML = '';
  detail.hidden = false;          // 先に表示してから組む(採寸が0にならないように)
  BUILDERS[key]();
  if (instant) {
    // ズーム直後は一瞬も部屋を見せない(フェードなしで即表示)
    detail.style.transition = 'none';
    detail.classList.add('on');
    requestAnimationFrame(() => { detail.style.transition = ''; });
  } else {
    requestAnimationFrame(() => detail.classList.add('on'));
  }
  if (location.hash !== '#' + key) history.pushState(null, '', '#' + key);
}

function closeDetail() {
  detail.classList.remove('on');
  clearTimeout(window._closeT);
  window._closeT = setTimeout(() => { detail.hidden = true; dcontent.innerHTML = ''; }, 300);
  currentView = null;
  if (location.hash) history.pushState(null, '', location.pathname);
}
document.getElementById('dback').addEventListener('click', closeDetail);
window.addEventListener('popstate', () => {
  const k = location.hash.slice(1);
  if (k && BUILDERS[k]) showDetail(k); else closeDetail();
});

const BUILDERS = {
  tv() {

    dcontent.appendChild(cap);
    function tune(i) {

      cap.textContent = `CH${i + 1}　${CHANNELS[i].t} ／ ${CHANNELS[i].c}　※掲載は協力会社の制作実績です`;
      [...btns.children].forEach((b, j) => b.classList.toggle('on', i === j));
    }
    const goEdit = document.createElement('button');

    goEdit.addEventListener('click', () => location.href = 'anime.html');
    dcontent.appendChild(goEdit);
    CHANNELS.forEach((ch, i) => {
      const b = document.createElement('button');
      b.className = 'chbtn';
      b.textContent = 'CH' + (i + 1);
      b.title = ch.t;
      b.addEventListener('click', () => tune(i));
      btns.appendChild(b);
    });
    tune(0);
  },
  blueprint() {
    const r = RECTS.blueprint || { x: 30, y: 24, w: 324, h: 166 };
    const p = document.createElement('div');
    p.className = 'dpanel';
    p.style.cssText = pctRect(r) + 'color:#D9ECFF;padding:2%;';
    p.innerHTML = `
      <h2>キャラクター設計・デザイン</h2>
      <p>スタジオパッチは「キャラクターを中心としたクリエイティブ」の会社です。
      性格、体のつくり、動きのクセ、世界での役割まで——
      1枚の設計図に落とし込むところからキャラクターづくりを始めます。</p>
      <p>マスコット、ブランドキャラクター、絵本やゲームの主人公。
      「描いて終わり」ではなく、アニメーションやグッズ、メタバースまで
      動かして育てられる設計をお渡しします。（※この文章は仮です）</p>
      <img src="sekkeizu.jpg" alt="パッチくんの設計図" style="max-width:100%;max-height:52%;border:2px solid #D9ECFF;display:block;">`;
    dcontent.appendChild(p);
  },
  book() {
    const L = arr4((RECTS.book || {}).left || [22, 30, 162, 170]);
    const R2 = arr4((RECTS.book || {}).right || [200, 30, 162, 170]);
    const SPREAD = { x: L.x, y: L.y, w: (R2.x + R2.w) - L.x, h: L.h };   // 見開き全面
    const img = document.createElement('img');
    img.style.cssText = pctRect(L) + 'object-fit:contain;background:#f5f5f7;';
    const txt = document.createElement('div');
    txt.style.cssText = pctRect(R2) +
      'color:#16161c;padding:5%;display:flex;flex-direction:column;justify-content:center;' +
      'align-items:center;text-align:center;overflow:hidden;font-family:inherit;';
    const nav = document.createElement('div');
    nav.style.cssText = 'position:absolute;left:50%;top:91.5%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;';
    nav.innerHTML = `<button class="navbtn" id="bprev">◀</button>
      <span id="bnum" style="color:#c8c8d0;font-size:clamp(11px,1.5vw,15px)"></span>

    dcontent.append(img, txt, nav);
    let i = 0;
    const draw = () => {

      const pg = BOOK.pages[i];

// モニタ: ふだんはスクリーンセーバー(星が中心から流れる)、
// カーソルが乗っているあいだだけ映像をループ再生する
(() => {
  const pc = document.getElementById('companylink');
  const mv = document.getElementById('pcmovie');
  const cv = document.getElementById('pcidle');
  if (!pc || !mv || !cv) return;
  const g = cv.getContext('2d');
  const SW = 92, SH = 28, CX = SW / 2, CY = SH / 2;
  const TONE = ['#2f5dc4', '#5b8ae8', '#9cc7f7', '#d9ecff'];   // 遠い星ほど暗い
  const stars = [];
  const spawn = (st, first) => {
    const a = Math.random() * Math.PI * 2;
    const r = 0.3 + Math.random() * 0.7;
    st.x = Math.cos(a) * r;
    st.y = Math.sin(a) * r;
    st.z = first ? 0.14 + Math.random() * 0.86 : 1;
  };
  for (let i = 0; i < 26; i++) { const st = {}; spawn(st, true); stars.push(st); }

  const draw = (step) => {
    g.clearRect(0, 0, SW, SH);
    for (const st of stars) {
      st.z -= step * 0.16;
      if (st.z <= 0.07) spawn(st, false);
      const px = Math.round(CX + (st.x / st.z) * CX * 0.5);
      const py = Math.round(CY + (st.y / st.z) * CY * 0.5);
      if (px < 0 || px >= SW || py < 0 || py >= SH) { spawn(st, false); continue; }
      g.fillStyle = TONE[Math.max(0, Math.min(3, Math.floor((1 - st.z) * 4.2)))];
      g.fillRect(px, py, 1, 1);
    }
  };

  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) { draw(0); return; }             // 動きを減らす設定のときは止まった星空

  let hovering = false, prev = 0, acc = 0;
  const tick = (t) => {
    requestAnimationFrame(tick);
    if (!prev) prev = t;
    const dt = Math.min(0.12, (t - prev) / 1000);
    prev = t;
    if (hovering || document.hidden) return;   // 映像が出ている間は止める
    acc += dt;
    if (acc < 1 / 12) return;                  // 12コマ/秒(ドット絵らしい間引き)
    draw(acc);
    acc = 0;
  };
  requestAnimationFrame(tick);

  const play = () => { hovering = true; const r = mv.play(); if (r) r.catch(() => {}); };
  const stop = () => { hovering = false; mv.pause(); };
  pc.addEventListener('mouseenter', play);
  pc.addEventListener('focus', play);
  pc.addEventListener('mouseleave', stop);
  pc.addEventListener('blur', stop);
})();

const ckv = document.getElementById('clockhands');
const cctx = ckv.getContext('2d');
function tickClock() {
  cctx.clearRect(0, 0, 38, 38);
  const d = new Date();
  const mAng = (d.getMinutes() + d.getSeconds() / 60) * Math.PI / 30 - Math.PI / 2;
  const hAng = ((d.getHours() % 12) + d.getMinutes() / 60) * Math.PI / 6 - Math.PI / 2;
  const hand = (ang, len) => {
    cctx.fillStyle = '#0e0a22';
    for (let r = 2; r <= len; r++) {
      cctx.fillRect(Math.round(19 + Math.cos(ang) * r), Math.round(19 + Math.sin(ang) * r), 1, 1);
    }
  };
  hand(hAng, 7);
  hand(mAng, 11);
  cctx.fillRect(18, 18, 2, 2);
}
