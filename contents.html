<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CONTENTS CREATIVE｜STUDIO PATTI</title>
<meta name="description" content="スタジオパッチの編集室。3DCGアニメーション・クラフトアニメーション・絵本・メタバースの作品が見られます。">
<meta name="theme-color" content="#05030f">
<link rel="icon" href="favicon.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="STUDIO PATTI">
<meta property="og:title" content="CONTENTS CREATIVE｜STUDIO PATTI">
<meta property="og:description" content="編集室へようこそ。パネルをえらんで、作品を見てみてね。">
<meta property="og:url" content="https://studiopatti.jp/contents.html">
<meta property="og:image" content="https://studiopatti.jp/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --scene-w: 384; --scene-h: 240; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05030f; color: #c9c9d4;
    font-family: system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #stage {
    position: absolute;
    left: 50%; top: 50%;
    margin-left: -192px; margin-top: -120px;
    width: 384px; height: 240px;
    transform-origin: center center;
    image-rendering: pixelated;
    overflow: hidden;
  }
  #stage img, #stage div { image-rendering: pixelated; }
  #room { position: absolute; left: 0; top: 0; width: 384px; height: 240px; }

  /* ─── 重なり順をここで一元管理(レイヤー事故防止) ─── */
  #room { z-index: 1; }
  #doorGlowStudio, #editblink, #marqblink, #screenglow, #motes { z-index: 2; }
  #screenbox { z-index: 3; }
  .hs, .mi, .nb, #catname { z-index: 4; }
  #mshadow, #mayu, #pshadow, #pattifloat { z-index: 5; }
  #navbar, #talkbox { z-index: 6; }

  /* ─── 上部ナビゲーション(TOPと同じ) ─── */
  #navbar {
    position: absolute; left: 0; top: 0; width: 384px; height: 15px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8, 6, 40, .92); border-bottom: 1px solid #2a2560;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    padding: 0 4px; box-sizing: border-box;
  }
  #navbar .brand { display: flex; align-items: center; cursor: pointer; }
  #navbar .brand img { height: 10px; width: auto; image-rendering: auto; }
  #navbar nav { display: flex; align-items: center; gap: 0; }
  #navbar nav button {
    border: 0; background: transparent; color: #ffffff; cursor: pointer;
    font-family: inherit; font-size: 6.5px; line-height: 1.1; padding: 1px 7px; text-align: center;
  }
  #navbar nav button + button {
    border-left: 1px solid #05041c;
    box-shadow: inset 1px 0 0 rgba(118, 110, 200, .3);
  }
  #navbar nav button:hover, #navbar nav button:focus-visible { color: #fcc800; background: rgba(252, 200, 0, .12); outline: none; }
  #navbar nav button.here { color: #f79db8; }

  /* ─── テキストボックス(TOPと同じ) ─── */
  #talkbox {
    position: absolute; left: 72px; top: 184px;
    width: 242px; height: 30px; box-sizing: border-box;
    background: rgba(8, 6, 40, .92);
    border: 2px solid #e8e4f4; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #2a2560;
    padding: 3px 14px 3px 6px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #f2eefc; font-size: 8px; line-height: 1.4;
  }
  #talkbox .name { color: #fcc800; }
  #talkbox .cursor {
    position: absolute; right: 5px; bottom: 3px;
    width: 0; height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 4px solid #f2eefc;
    animation: tbc 1s steps(1) infinite;
  }
  @keyframes tbc { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }

  /* ─── スタジオへ戻る戸口(白い光) ─── */
  #doorStudio { clip-path: polygon(6% 6%, 94% 1%, 94% 72%, 6% 99%); }
  #doorStudio::after {
    background: radial-gradient(closest-side,
      rgba(244, 242, 255, .55) 0%, rgba(214, 210, 236, .3) 40%,
      rgba(170, 166, 200, .1) 70%, rgba(170, 166, 200, 0) 100%);
  }
  #doorGlowStudio {
    position: absolute; left: -18px; top: 40px; width: 118px; height: 186px;
    pointer-events: none; mix-blend-mode: screen;
    animation: doorbreath 4.6s ease-in-out infinite;
    background: radial-gradient(closest-side at 32% 55%,
      rgba(236, 234, 252, .46) 0%, rgba(206, 202, 232, .22) 45%, rgba(206, 202, 232, 0) 78%);
  }
  @keyframes doorbreath { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #doorGlowStudio { animation: none; } }

  /* ─── 編集卓のボタンのキラキラ(3コマ・LEDの明滅) ─── */
  #editblink {
    position: absolute; left: 0; top: 106px;
    width: 384px; height: 34px; pointer-events: none;
    background-image: url(edit_blink.png);
    background-size: 1152px 34px;
    animation: editblink 1.15s steps(1) infinite;
  }
  @keyframes editblink {
    0%, 33.3% { background-position: 0 0; }
    33.4%, 66.6% { background-position: -384px 0; }
    66.7%, 100% { background-position: -768px 0; }
  }
  @media (prefers-reduced-motion: reduce) { #editblink { animation: none; } }

  /* ─── 電飾マーキーの電球がぐるりと流れる(4コマ) ─── */
  #marqblink {
    position: absolute; left: 0; top: 18px;
    width: 384px; height: 36px; pointer-events: none;
    background-image: url(marquee_blink.png);
    background-size: 1536px 36px;
    animation: marqblink 1.0s steps(1) infinite;
  }
  @keyframes marqblink {
    0%, 24.9% { background-position: 0 0; }
    25%, 49.9% { background-position: -384px 0; }
    50%, 74.9% { background-position: -768px 0; }
    75%, 100% { background-position: -1152px 0; }
  }
  @media (prefers-reduced-motion: reduce) { #marqblink { animation: none; } }

  /* ─── 大スクリーン(中身はここに載る) ─── */
  #screenbox {
    position: absolute; left: 133px; top: 21px;
    width: 154px; height: 87px; overflow: hidden;
    background: transparent;
  }
  #screenglow {
    position: absolute; left: 119px; top: 10px; width: 183px; height: 112px;
    pointer-events: none; mix-blend-mode: screen; display: none;
    background: radial-gradient(closest-side, rgba(126, 224, 235, .20), rgba(126, 224, 235, 0) 80%);
  }
  #scrwait { position: absolute; inset: 0; }
  #wstars { position: absolute; left: 0; top: 0; }
  #wplay {
    position: absolute; left: 0; top: 16px; width: 142px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #7ecfe0; font-size: 17px; text-align: center;
    text-shadow: 0 0 4px rgba(126, 224, 235, .9);
    animation: wbreath 2.4s ease-in-out infinite;
  }
  #wtext {
    position: absolute; left: 0; top: 44px; width: 142px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #6d7fc0; font-size: 7px; line-height: 1.8; text-align: center;
  }
  @keyframes wbreath { 0%, 100% { opacity: .45; } 50% { opacity: 1; } }
  #scrsnd {
    position: absolute; right: 2px; bottom: 2px; display: none;
    border: 1px solid rgba(126, 224, 235, .55); background: rgba(8, 6, 40, .78);
    color: #b8ecf4; cursor: pointer; padding: 1px 3px;
    font-family: 'DotGothic16', 'MS Gothic', monospace; font-size: 6px; line-height: 1.2;
  }
  #scrsnd:hover, #scrsnd:focus-visible { color: #ffffff; background: rgba(126, 224, 235, .25); outline: none; }
  @media (prefers-reduced-motion: reduce) { #wplay { animation: none; } }
  #scrframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none; background: #000; }
  #scrguard { position: absolute; inset: 0; display: none; }   /* 動画の上の透明ガード(UIを出さない) */
  #bookbox { position: absolute; inset: 0; display: none; background: #0a0820; }
  #bkimg {
    position: absolute; left: 14px; top: 0; width: 114px; height: 74px;
    object-fit: contain; image-rendering: auto;
  }
  .bknav {
    position: absolute; top: 0; width: 14px; height: 74px;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #f2eefc; font-size: 9px; line-height: 74px; text-align: center;
  }
  .bknav:hover, .bknav:focus-visible { color: #fcc800; background: rgba(252, 200, 0, .10); outline: none; }
  #bkprev { left: 0; }
  #bknext { right: 0; }
  #bknum {
    position: absolute; left: 0; bottom: 0; width: 142px; height: 7px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #8a86b0; font-size: 5px; line-height: 7px; text-align: center;
  }

  /* ─── 左のメニューパネル(5項目・▶で選ぶ) ─── */
  .mi {
    position: absolute; left: 43px; width: 80px; height: 22px;
    border: 0; background: transparent; cursor: pointer; padding: 0 1px 0 6px;
    box-sizing: border-box; text-align: left; white-space: nowrap;
    display: flex; align-items: center;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #b9b4d8; font-size: 6px; line-height: 1;
  }
  /* ▶はカード内に収めたいので、6pxの文字ではなく3pxのCSS三角にする */
  .mi .cur {
    position: absolute; left: 1px; top: 50%; margin-top: -3px;
    width: 0; height: 0; visibility: hidden;
    border-left: 4px solid #f79db8;
    border-top: 3px solid transparent; border-bottom: 3px solid transparent;
  }
  .mi.sel { color: #ffffff; }
  .mi.sel .cur { visibility: visible; }
  .mi:hover, .mi:focus-visible { color: #ffffff; background: rgba(236, 148, 190, .12); outline: none; }

  /* ─── 右のカテゴリ表示と数字ボタン ─── */
  #catname {
    position: absolute; left: 297px; top: 23px; width: 42px; height: 26px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #fff6e0; font-size: 6px; line-height: 1.6; text-align: center;
    text-shadow: 0 0 3px rgba(255, 232, 176, .55);
    pointer-events: none;
  }
  .nb {
    position: absolute; width: 19px; height: 19px;
    border: 0; background: transparent; cursor: pointer; padding: 0;
    border-radius: 50%;
  }
  .nb::after {
    content: ''; position: absolute; inset: -3px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(255, 212, 232, .55), rgba(255, 212, 232, 0) 78%);
    mix-blend-mode: screen; opacity: 0; transition: opacity .15s ease;
  }
  .nb:not(.off)::after { animation: nbreath 3.2s ease-in-out infinite; }
  .nb:hover:not(.off)::after, .nb:focus-visible:not(.off)::after { animation: none; opacity: 1; }
  .nb.on::after { animation: none; opacity: 1; }
  @keyframes nbreath { 0%, 100% { opacity: 0; } 50% { opacity: .38; } }
  @media (prefers-reduced-motion: reduce) { .nb:not(.off)::after { animation: none; } }
  .nb.off { cursor: default; }
  .nb.off::before {
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: rgba(10, 6, 30, .62);   /* 数字がないスイッチは薄暗く */
  }

  /* ─── キャラクター ─── */
  /* おばけなので、ふわりと浮き沈みする */
  #pattifloat {
    position: absolute; left: 316px; top: 136px; width: 32px; height: 48px;
    animation: pattifloat 3.1s ease-in-out infinite;
  }
  @keyframes pattifloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { #pattifloat { animation: none; } }
  #patti {
    position: absolute; left: 0; top: 0;
    width: 32px; height: 48px;
    background-image: url(patti_front_shaded.png);
    background-repeat: no-repeat;
    background-size: 384px 48px;
    transform: scale(.75); transform-origin: 50% 100%;
    animation: pattichar 1.2s steps(12) infinite;
  }
  @keyframes pattichar { from { background-position: 0 0; } to { background-position: -384px 0; } }
  #pshadow {
    position: absolute; left: 321px; top: 180px;
    width: 22px; height: 5px;
    border-radius: 50%; background: rgba(64, 24, 108, .5);
  }
  #mayu {
    position: absolute; left: 34px; top: 112px;
    width: 30px; height: 72px;
    background-image: url(mayu_back_shaded.png);
    background-repeat: no-repeat;
    background-size: 360px 72px;
    transform: scale(.75); transform-origin: 50% 100%;
    animation: mayuchar 1.2s steps(12) infinite;
  }
  @keyframes mayuchar { from { background-position: 0 0; } to { background-position: -360px 0; } }
  @media (prefers-reduced-motion: reduce) { #patti, #mayu { animation: none; } }
  #mshadow {
    position: absolute; left: 39px; top: 180px;
    width: 20px; height: 5px;
    border-radius: 50%; background: rgba(64, 24, 108, .5);
  }

  /* ─── 汎用ホットスポット ─── */
  .hs {
    position: absolute; display: block; cursor: pointer;
    border: 0; background: transparent; padding: 0; border-radius: 0;
  }
  .hs::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: var(--gw, 164%); height: var(--gh, 164%);
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(244, 240, 255, .6) 0%, rgba(214, 208, 240, .35) 34%,
      rgba(180, 172, 220, .14) 60%, rgba(180, 172, 220, 0) 100%);
    mix-blend-mode: screen; pointer-events: none;
    opacity: 0; transition: opacity .2s ease;
  }
  .hs:hover::after, .hs:focus-visible::after { opacity: var(--gi, 1); }
  @media (prefers-reduced-motion: reduce) { .hs::after { transition: none; } }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1b1b24; border: 1px solid #34343f; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; color: #eee;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50;
  }

  /* ─── スマホ(縦持ち)への案内(TOPと同じ) ─── */
  #rotate {
    position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #05030f; padding: 24px;
    font-family: 'DotGothic16', 'MS Gothic', monospace; text-align: center;
  }
  #rotate .phone {
    width: 144px; height: 144px; image-rendering: pixelated;
    background-image: url(rotate_phone.png);
    background-size: 1440px 144px;
    animation: phoneturn 2.6s steps(1) infinite;
  }
  @keyframes phoneturn {
    0%,9.9%    { background-position: 0 0; }
    10%,19.9%  { background-position: -144px 0; }
    20%,29.9%  { background-position: -288px 0; }
    30%,39.9%  { background-position: -432px 0; }
    40%,49.9%  { background-position: -576px 0; }
    50%,59.9%  { background-position: -720px 0; }
    60%,69.9%  { background-position: -864px 0; }
    70%,79.9%  { background-position: -1008px 0; }
    80%,89.9%  { background-position: -1152px 0; }
    90%,100%   { background-position: -1296px 0; }
  }
  #rotate .msg {
    position: relative; max-width: 340px; box-sizing: border-box;
    background: rgba(8, 6, 40, .92);
    border: 2px solid #e8e4f4; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #2a2560;
    padding: 13px 12px 12px 54px; color: #f2eefc;
    font-size: clamp(11px, 3.4vw, 14px); line-height: 1.7; text-align: left;
    white-space: nowrap;
  }
  #rotate .msg b {
    color: #fcc800; font-weight: normal; display: block;
    font-size: clamp(12px, 3.9vw, 16px); margin-bottom: 2px;
  }
  #rotate .patti {
    position: absolute; left: 8px; bottom: 6px;
    width: 36px; height: 48px; image-rendering: pixelated;
    background-image: url(patti_shaded.png);
    background-size: 2160px 48px;
    animation: pattiidle 1.2s steps(12) infinite;
  }
  @keyframes pattiidle { from { background-position: 0 0; } to { background-position: -432px 0; } }
  #rotate .anyway {
    background: none; border: 0; color: #8b86a8;
    font-family: inherit; font-size: 12px; text-decoration: underline;
    cursor: pointer; padding: 6px 10px;
  }
  @media (orientation: portrait) and (max-width: 900px) {
    body:not(.seeanyway) #rotate { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    #rotate .phone, #rotate .patti { animation: none; }
    #rotate .phone { background-position: -1296px 0; }
  }

  /* ─── 光の中を舞うチリ(空気感) ─── */
  #motes {
    position: absolute; left: 0; top: 0; width: 384px; height: 240px;
    pointer-events: none; image-rendering: pixelated;
  }
</style>
</head>
<body>

<div id="rotate" role="dialog" aria-label="画面を横向きにしてください">
  <div class="phone" aria-hidden="true"></div>
  <div class="msg">
    <div class="patti" aria-hidden="true"></div>
    <b>スマホを横向きにしてね！</b>
    よこにすると、<br>編集室が<br>ぜんぶ見えるよ！
  </div>
  <button class="anyway" type="button">このまま見る</button>
</div>

<div id="wrap">
  <div id="stage">
    <img id="room" src="room_edit.png" alt="編集室">
    <div id="doorGlowStudio" aria-hidden="true"></div>
    <div id="editblink" aria-hidden="true"></div>
    <div id="marqblink" aria-hidden="true"></div>
    <div id="screenglow" aria-hidden="true"></div>

    <div id="screenbox">
      <div id="scrwait">
        <canvas id="wstars" width="142" height="80" aria-hidden="true"></canvas>
        <div id="wplay" aria-hidden="true">▶</div>
        <div id="wtext">左のパネルを ▶ でえらんで<br>右のすうじをおしてね</div>
      </div>
      <iframe id="scrframe" title="作品の再生画面" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
      <div id="bookbox">
        <img id="bkimg" src="" alt="絵本のページ">
        <button id="bkprev" class="bknav" type="button" aria-label="前のページに戻る">◀</button>
        <button id="bknext" class="bknav" type="button" aria-label="次のページに進む">▶</button>
        <div id="bknum"></div>
      </div>
      <div id="scrguard" aria-hidden="true"></div>
      <button id="scrsnd" type="button" aria-label="音を出す">♪ おとを出す</button>
    </div>

    <button id="doorStudio" class="hs" style="left:6px;top:48px;width:33px;height:168px;--gi:.4"
            aria-label="スタジオ(トップページ)にもどる"></button>

    <div id="catname" aria-live="polite">コンテンツ<br>クリエイティブ</div>

    <canvas id="motes" width="384" height="240" aria-hidden="true"></canvas>
    <div id="talkbox">
      <span class="name">パッチ</span>
      <span id="talktext"></span>
      <span class="cursor" aria-hidden="true"></span>
    </div>

    <div id="mshadow" aria-hidden="true"></div>
    <div id="mayu" role="img" aria-label="スクリーンを見ているマユちゃん"></div>
    <div id="pshadow" aria-hidden="true"></div>
    <div id="pattifloat" aria-hidden="true"><div id="patti" role="img" aria-label="パッチくん"></div></div>

    <div id="navbar">
      <div class="brand" id="brandhome" role="link" tabindex="0" aria-label="トップページへ"><img src="nav_logo.png" alt="STUDIO PATTI"></div>
      <nav>
        <button data-k="company">COMPANY</button>
        <button data-k="chdesign">CHARACTER<br>DESIGN</button>
        <button data-k="contents" class="here">CONTENTS<br>CREATIVE</button>
        <button data-k="spook">Patti the Spook</button>
        <button data-k="contact">CONTACT US</button>
      </nav>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─────────────────────────────────────────────
// ステージのスケーリング(TOPと同じ)
// ─────────────────────────────────────────────
const stage = document.getElementById('stage');
function fitStage() {
  const s = Math.max(0.5, Math.min(window.innerWidth / 384, window.innerHeight / 240));
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
document.addEventListener('visibilitychange', fitStage);
setTimeout(fitStage, 400);
fitStage();

const NOCACHE = { cache: 'no-cache' };

// ─────────────────────────────────────────────
// テキストボックス
// ─────────────────────────────────────────────
const talktext = document.getElementById('talktext');
const TALK_DEFAULT = 'ここは編集室だよ！左のパネルを▶でえらんで、<br>右のパネルのすうじをえらんでね！';
const setTalk = t => { talktext.innerHTML = t; };
setTalk(TALK_DEFAULT);

function tease(name) {
  setTalk('「' + name + '」のページは いま準備中！<br>たのしみに待っててね！');
  clearTimeout(window._tz);
  window._tz = setTimeout(() => setTalk(TALK_DEFAULT), 3200);
}

function hoverTalk(el, text) {
  el.addEventListener('mouseenter', () => setTalk(text));
  el.addEventListener('focus', () => setTalk(text));
  el.addEventListener('mouseleave', () => setTalk(TALK_DEFAULT));
  el.addEventListener('blur', () => setTalk(TALK_DEFAULT));
}

// ─────────────────────────────────────────────
// カテゴリと作品(左パネルの項目 → 右パネルの数字)
// ─────────────────────────────────────────────
// 再生画面にボタン類を出さない工夫:
// - 自動再生(ミュート)+ループで「上映」として流す。音は画面右下の「♪」ボタンで出す
// - iframeの上に透明ガードを重ねてマウスを渡さない(VimeoのUIはホバーが無ければ出ない)
// - Vimeoのbackgroundモードは有料プラン限定のため使わない
const V = id => 'https://player.vimeo.com/video/' + id + '?autoplay=1&muted=1&loop=1&title=0&byline=0&portrait=0&dnt=1';
const Y = id => 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&mute=1&controls=0&loop=1&playlist=' + id + '&rel=0&playsinline=1&enablejsapi=1';
const M = n => 'meta:' + n;      // メタバースは画像の連番(metaverse.json)
// items[j] = 再生するもの / titles[j] = 電飾マーキーに出す名前
const CATS = [
  { name: '私たちの創造', disp: '私たちの創造', items: [], titles: [] },
  { name: 'アニメーション', disp: 'アニメーション',
    items: [V('1029119982'), V('1166566557'), Y('Y3UOLaso-MI'), V('708043721')],
    titles: ["The Seven Deadly Sins - The Battle of Light and Darkness", "Honor Of Kings - The Story of Treasure", "【赤ちゃんが喜ぶ歌】すきなきもちもち（うた：SAKANAMON）【赤ちゃんが泣き止む・喜ぶ動画】", "QQ Dance - Ice Queen.mp4"] },
  { name: '絵本', disp: '絵本',
    items: ['book'], titles: ['おばけのパッチ'] },
  { name: 'メタバース', disp: 'メタバース',
    items: [M(0), M(1), M(2), M(3)], titles: [] },     // 名前は metaverse.json から入れる
  { name: '実写映像', disp: '実写映像',
    items: [Y('a6ickLwrHRE'), Y('RBAMbSCEbSQ'), Y('XKyWWychUZA'), Y('bomW6K3pvsY')],
    titles: ["【インタビュー映像】彩響衆 樂クラファン用", "【ドキュメンタリー映像】50 days until GAKU FES【彩響衆 樂】", "【インタビュー映像】KATANAクラファン用", "【プロモーション映像】一宮市七夕祭り"] },
];
let META = null;
fetch('metaverse.json', NOCACHE).then(r => r.json()).then(j => {
  META = j;
  CATS[3].titles = j.map(g => g.name);
}).catch(() => {});

const MENU_TOP = 28, MENU_H = 22;   // カード(y30+22i,高19)の中心とボタンの中心を合わせる
const BTN_POS = [[297, 85], [321, 85], [297, 110], [321, 110]];   // 丸ボタン(19x19)の左上
let cat = 0, num = -1, bkpage = 0;

// メニュー項目(5つ)
const miEls = [];
CATS.forEach((c, i) => {
  const b = document.createElement('button');
  b.className = 'mi';
  b.style.top = (MENU_TOP + i * MENU_H) + 'px';

// 数字ボタン(4つ)
const nbEls = [];
BTN_POS.forEach(([x, y], j) => {
  const b = document.createElement('button');
  b.className = 'nb';
  b.style.left = x + 'px';
  b.style.top = y + 'px';

  b.addEventListener('click', () => selectNum(j));
  b.addEventListener('mouseenter', () => {

    else setTalk((j + 1) + 'ばんの作品が見られるよ！おしてみて！');

  stage.appendChild(b);

const scrsnd = document.getElementById('scrsnd');
let sndOn = false;

function applySound() {
  const w = scrframe.contentWindow;
  if (!w || scrframe.style.display === 'none') return;
  if (scrframe.src.indexOf('vimeo') >= 0) {
    w.postMessage(JSON.stringify({ method: 'setMuted', value: !sndOn }), '*');
    w.postMessage(JSON.stringify({ method: 'setVolume', value: sndOn ? 1 : 0 }), '*');
  } else {
    w.postMessage(JSON.stringify({ event: 'command', func: sndOn ? 'unMute' : 'mute', args: [] }), '*');
    if (sndOn) w.postMessage(JSON.stringify({ event: 'command', func: 'setVolume', args: [100] }), '*');
  }
}
function setSnd(on) {
  sndOn = on;
  scrsnd.textContent = on ? '♪ おとを消す' : '♪ おとを出す';
  scrsnd.setAttribute('aria-label', on ? '音を消す' : '音を出す');
  applySound();
}
scrsnd.addEventListener('click', () => setSnd(!sndOn));

function stopScreen() {
  num = -1;
  scrframe.src = 'about:blank';
  scrframe.style.display = 'none';
  document.getElementById('scrguard').style.display = 'none';
  bookbox.style.display = 'none';
  scrwait.style.display = 'block';
  screenglow.style.display = 'none';
  scrsnd.style.display = 'none';
  sndOn = false;
  scrsnd.textContent = '♪ おとを出す';
  nbEls.forEach(b => b.classList.remove('on'));
}

function selectCat(i) {
  cat = i;
  miEls.forEach((b, k) => b.classList.toggle('sel', k === i));
  catname.innerHTML = CATS[i].disp;          // まずは項目名。番号を押すと作品名に変わる
  catname.classList.remove('long');
  nbEls.forEach((b, j) => b.classList.toggle('off', !CATS[i].items[j]));
  stopScreen();
  if (CATS[i].items.length === 0) {
    setTalk('「' + CATS[i].name + '」の作品はいま準備中！<br>たのしみに待っててね！');
    clearTimeout(window._tz);
    window._tz = setTimeout(() => setTalk(TALK_DEFAULT), 3200);
  }
}

function selectNum(j) {
  const item = CATS[cat].items[j];
  if (!item) {
    setTalk('この番号はいま準備中だよ！');
    clearTimeout(window._tz);
    window._tz = setTimeout(() => setTalk(TALK_DEFAULT), 2600);
    return;
  }
  num = j;
  nbEls.forEach((b, k) => b.classList.toggle('on', k === j));
  const tt = (CATS[cat].titles || [])[j];    // 電球の枠に「いま流れているもの」の名前を出す
  if (tt) {
    catname.textContent = tt;
    catname.classList.toggle('long', tt.length > 16);
  }
  scrwait.style.display = 'none';
  screenglow.style.display = 'block';
  if (typeof item === 'string' && item.startsWith('meta:')) {
    scrframe.src = 'about:blank';
    scrframe.style.display = 'none';
    document.getElementById('scrguard').style.display = 'none';
    scrsnd.style.display = 'none';
    bookbox.style.display = 'block';
    metaIdx = parseInt(item.slice(5), 10);
    bkpage = 0;
    drawBook();
  } else if (item === 'book') {
    metaIdx = -1;
    scrframe.src = 'about:blank';
    scrframe.style.display = 'none';
    document.getElementById('scrguard').style.display = 'none';
    scrsnd.style.display = 'none';
    bookbox.style.display = 'block';
    bkpage = 0;
    drawBook();
  } else {
    metaIdx = -1;
    bookbox.style.display = 'none';
    scrframe.src = item;
    scrframe.style.display = 'block';
    document.getElementById('scrguard').style.display = 'block';
    sndOn = false;
    scrsnd.textContent = '♪ おとを出す';
    scrsnd.style.display = 'block';
    // 読み込み直後にミュート状態を確実にそろえる
    scrframe.addEventListener('load', applySound, { once: true });
  }
}

// ─── 画面に出す連番画像(絵本 / メタバース で共用) ───
let metaIdx = -1;
function pages() {
  if (metaIdx >= 0) return META ? META[metaIdx].files : null;
  return BOOK ? BOOK.pages.map(pg => pg.img) : null;
}
function drawBook() {
  const ps = pages();
  if (!ps) { document.getElementById('bknum').textContent = '準備中…'; return; }
  bkpage = (bkpage + ps.length) % ps.length;
  document.getElementById('bkimg').src = ps[bkpage];
  document.getElementById('bknum').textContent = (bkpage + 1) + ' / ' + ps.length;
}
document.getElementById('bkprev').addEventListener('click', () => {
  if (!pages()) return;
  bkpage -= 1;
  drawBook();
});
document.getElementById('bknext').addEventListener('click', () => {
  if (!pages()) return;
  bkpage += 1;
  drawBook();
});

// キャラクター: マユちゃん(後ろ姿でスクリーンを見ている) / パッチ(正面)
// どちらも multishot の12コマをCSSの steps(12) で再生している(JSは不要)

// ─────────────────────────────────────────────
// 待機中のスクリーン: 星がまたたくスクリーンセーバー(シアン系)
// ─────────────────────────────────────────────
(() => {
  const cv = document.getElementById('wstars');
  const g = cv.getContext('2d');
  const SW = 142, SH = 80;
  const TONE = ['#1c5a74', '#2ca4ba', '#7ee0eb', '#d6faff'];
  const stars = [];
  for (let i = 0; i < 22; i++) {
    // 説明文の帯(y42..70)を避けて散らす
    const yy = Math.random() < 0.8 ? Math.floor(Math.random() * 40)
                                   : 72 + Math.floor(Math.random() * 7);
    stars.push({ x: Math.floor(Math.random() * SW), y: yy,
                 ph: Math.random() * Math.PI * 2, sp: 0.6 + Math.random() * 1.2 });
  }
  const draw = (t) => {
    g.clearRect(0, 0, SW, SH);
    for (const st of stars) {
      const k = (Math.sin(t / 1000 * st.sp + st.ph) + 1) / 2;
      const ti = Math.min(3, Math.floor(k * 4));
      g.fillStyle = TONE[ti];
      g.fillRect(st.x, st.y, 1, 1);
      if (ti === 3) {                       // いちばん明るい瞬間は十字にきらめく
        g.fillStyle = TONE[1];
        g.fillRect(st.x - 1, st.y, 1, 1); g.fillRect(st.x + 1, st.y, 1, 1);
        g.fillRect(st.x, st.y - 1, 1, 1); g.fillRect(st.x, st.y + 1, 1, 1);
      }
    }
  };
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) { draw(0); return; }
  let prev = 0;
  const tick = (t) => {
    requestAnimationFrame(tick);
    if (document.hidden || scrwait.style.display === 'none') return;
    if (t - prev < 1000 / 12) return;       // 12コマ/秒(ドット絵らしい間引き)
    prev = t;
    draw(t);
  };
  requestAnimationFrame(tick);
})();
const MOTE_LIGHTS = [[205, 66, 96], [24, 118, 70], [205, 120, 60]];
const MOTE_BOT = 150;
const MOTE_COL = a => `rgba(190,232,244,${a * 0.85})`;

// ─────────────────────────────────────────────
// 光の中を舞うチリ。光源に近いほど明るく見える(空気感)
// ─────────────────────────────────────────────
(() => {
  const cv = document.getElementById('motes');
  if (!cv) return;
  const g = cv.getContext('2d');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const N = 34;
  const ms = [];
  for (let i = 0; i < N; i++) {
    ms.push({
      x: Math.random() * 384, y: 16 + Math.random() * (MOTE_BOT - 16),
      vx: (Math.random() - 0.5) * 3.2, vy: -1.6 - Math.random() * 2.4,
      ph: Math.random() * Math.PI * 2, sp: 0.5 + Math.random() * 1.1,
    });
  }
  const draw = (dt, t) => {
    g.clearRect(0, 0, 384, 240);
    for (const m of ms) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y < 14) { m.y = MOTE_BOT; m.x = Math.random() * 384; }
      if (m.x < -2) m.x = 386; else if (m.x > 386) m.x = -2;
      // 光源からの距離で明るさを決める(近いほど見える)
      let best = 0;
      for (const [lx, ly, lr] of MOTE_LIGHTS) {
        const d = Math.hypot(m.x - lx, m.y - ly);
        if (d < lr) best = Math.max(best, 1 - d / lr);
      }
      if (best < 0.06) continue;
      const tw = 0.55 + 0.45 * Math.sin(t * m.sp + m.ph);
      const a = best * tw;
      if (a < 0.12) continue;
      g.fillStyle = MOTE_COL(a);
      g.fillRect(Math.round(m.x), Math.round(m.y), 1, 1);
    }
  };
  if (still) { draw(0, 0); return; }
  let prev = 0, acc = 0;
  const tick = (ts) => {
    requestAnimationFrame(tick);
    if (!prev) prev = ts;
    const dt = Math.min(0.1, (ts - prev) / 1000); prev = ts;
    if (document.hidden) return;
    acc += dt;
    if (acc < 1 / 14) return;          // 14コマ/秒(ドット絵らしい間引き)
    draw(acc, ts / 1000); acc = 0;
  };
  requestAnimationFrame(tick);
})();
