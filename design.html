<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHARACTER DESIGN｜STUDIO PATTI</title>
<meta name="description" content="スタジオパッチのデザイン室。キャラクターのデザインと設計、世界観、物語、キャラクターに関する資料が見られます。">
<meta name="theme-color" content="#05030f">
<link rel="icon" href="favicon.png" type="image/png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="STUDIO PATTI">
<meta property="og:title" content="CHARACTER DESIGN｜STUDIO PATTI">
<meta property="og:description" content="デザイン室へようこそ。黒板に貼ってある紙をさわってみてね。">
<meta property="og:url" content="https://studiopatti.jp/design.html">
<meta property="og:image" content="https://studiopatti.jp/ogp.png">
<meta name="twitter:card" content="summary_large_image">
<style>
  :root { --scene-w: 384; --scene-h: 240; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: #05030f; color: #c9c9d4;
    font-family: system-ui, sans-serif;
  }
  #wrap { position: fixed; inset: 0; overflow: hidden; }
  #stage {
    position: absolute; left: 50%; top: 50%;
    margin-left: -192px; margin-top: -120px;
    width: 384px; height: 240px;
    transform-origin: center center;
    image-rendering: pixelated; overflow: hidden;
  }
  #stage img, #stage div, #stage button { image-rendering: pixelated; }
  #room { position: absolute; left: 0; top: 0; width: 384px; height: 240px; }

  /* ─── 重なり順をここで一元管理(レイヤー事故防止) ─── */
  #room { z-index: 1; }
  #garblink, #doorGlowStudio { z-index: 2; }
  .hs, .pp, #ppstory { z-index: 4; }
  #mshadow, #mayu, #pshadow, #pattifloat { z-index: 5; }
  #navbar, #talkbox { z-index: 6; }

  /* ─── 上部ナビゲーション(TOPと同じ) ─── */
  #navbar {
    position: absolute; left: 0; top: 0; width: 384px; height: 15px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(8, 6, 40, .92); border-bottom: 1px solid #2a2560;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    padding: 0 4px; box-sizing: border-box;
  }
  #navbar .brand { display: flex; align-items: center; cursor: pointer; }
  #navbar .brand img { height: 10px; width: auto; image-rendering: auto; }
  #navbar nav { display: flex; align-items: center; gap: 0; }
  #navbar nav button {
    border: 0; background: transparent; color: #ffffff; cursor: pointer;
    font-family: inherit; font-size: 6.5px; line-height: 1.1; padding: 1px 7px; text-align: center;
  }
  #navbar nav button + button {
    border-left: 1px solid #05041c;
    box-shadow: inset 1px 0 0 rgba(118, 110, 200, .3);
  }
  #navbar nav button:hover, #navbar nav button:focus-visible { color: #fcc800; background: rgba(252, 200, 0, .12); outline: none; }
  #navbar nav button.here { color: #f79db8; }

  /* ─── テキストボックス(TOPと同じ) ─── */
  #talkbox {
    position: absolute; left: 72px; top: 184px;
    width: 242px; height: 30px; box-sizing: border-box;
    background: rgba(8, 6, 40, .92);
    border: 2px solid #e8e4f4; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #2a2560;
    padding: 3px 14px 3px 6px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    color: #f2eefc; font-size: 8px; line-height: 1.4;
  }
  #talkbox .name { color: #fcc800; }
  #talkbox .cursor {
    position: absolute; right: 5px; bottom: 3px;
    width: 0; height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 4px solid #f2eefc;
    animation: tbc 1s steps(1) infinite;
  }
  @keyframes tbc { 0%,50% { opacity: 1; } 50.01%,100% { opacity: 0; } }


  /* ─── スタジオへ戻る戸口(白い光・右の壁) ─── */
  #doorStudio { clip-path: polygon(6% 1%, 94% 6%, 94% 99%, 6% 72%); }
  #doorStudio::after {
    background: radial-gradient(closest-side,
      rgba(244, 242, 255, .55) 0%, rgba(214, 210, 236, .3) 40%,
      rgba(170, 166, 200, .1) 70%, rgba(170, 166, 200, 0) 100%);
  }
  #doorGlowStudio {
    position: absolute; left: 284px; top: 40px; width: 118px; height: 186px;
    pointer-events: none; mix-blend-mode: screen;
    animation: doorbreath 4.6s ease-in-out infinite;
    background: radial-gradient(closest-side at 68% 55%,
      rgba(236, 234, 252, .46) 0%, rgba(206, 202, 232, .22) 45%, rgba(206, 202, 232, 0) 78%);
  }
  @keyframes doorbreath { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }

  /* ─── 天井の電球がまたたく(3コマ) ─── */
  #garblink {
    position: absolute; left: 0; top: 8px; width: 384px; height: 20px;
    pointer-events: none;
    background-image: url(design_garland.png);
    background-size: 1152px 20px;
    animation: garblink 1.35s steps(1) infinite;
  }
  @keyframes garblink {
    0%, 33.2%   { background-position: 0 0; }
    33.3%, 66.5% { background-position: -384px 0; }
    66.6%, 100% { background-position: -768px 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #doorGlowStudio, #garblink { animation: none; }
  }

  /* ─── 黒板に貼ってある紙(そのままボタン) ─── */
  .pp {
    position: absolute; border: 0; background: transparent; padding: 0 2px;
    box-sizing: border-box; cursor: pointer;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
    font-size: 6px; line-height: 1.5; text-align: center;
    display: flex; align-items: center; justify-content: center;
    transition: transform .12s ease;
  }
  .pp::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 132%; height: 168%;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(255, 226, 158, .62) 0%, rgba(255, 206, 120, .34) 40%,
      rgba(255, 196, 100, 0) 100%);
    mix-blend-mode: screen; pointer-events: none;
    opacity: 0; transition: opacity .18s ease;
  }
  .pp:hover, .pp:focus-visible { transform: translateY(-1px); outline: none; }
  .pp:hover::after, .pp:focus-visible::after { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .pp { transition: none; } }
  /* Spooks GS: 紙の内側に実画像をそのまま(なめらかに)出す */
  #spooksimg {
    position: absolute; left: 2px; top: 2px;
    width: calc(100% - 4px); height: calc(100% - 4px);
    object-fit: cover; image-rendering: auto; display: block;
    pointer-events: none;
  }
  /* 見出しはチョークで書いてあるので紙より控えめに光らせる */
  #ppdatatitle::after { width: 116%; height: 190%; }
  /* 紙の上の文字: 白抜き+濃い縁取りで、紙の地に負けないようにする */
  .pp span {
    display: block; color: #ffffff;
    text-shadow: 1px 0 0 #2a1436, -1px 0 0 #2a1436, 0 1px 0 #2a1436, 0 -1px 0 #2a1436;
  }
  /* 「押せる」と分かるように、紙のふちを常時ほんのり光らせて呼吸させる */
  .pp.tap::before {
    content: ''; position: absolute; inset: -1px;
    border: 1px solid rgba(255, 232, 168, .55);
    animation: tapbreath 2.4s ease-in-out infinite; pointer-events: none;
  }
  @keyframes tapbreath { 0%, 100% { opacity: .35; } 50% { opacity: .95; } }
  .pp.tap:hover::before, .pp.tap:focus-visible::before { opacity: 1; animation: none; }
  @media (prefers-reduced-motion: reduce) { .pp.tap::before { animation: none; } }
  /* Story is King: 黒板の上の標語。他と違うフォントで、押せないもの */
  #ppstory {
    position: absolute; left: 128px; top: 25px; width: 128px; height: 14px;
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    font-size: 9px; letter-spacing: .6px; color: #3a3446;
    pointer-events: auto; cursor: default;
  }

  /* ─── 汎用ホットスポット ─── */
  .hs {
    position: absolute; display: block; cursor: pointer;
    border: 0; background: transparent; padding: 0; border-radius: 0;
  }
  .hs::after {
    content: ''; position: absolute; left: 50%; top: 50%;
    width: var(--gw, 164%); height: var(--gh, 164%);
    transform: translate(-50%, -50%); border-radius: 50%;
    background: radial-gradient(closest-side,
      rgba(244, 240, 255, .6) 0%, rgba(214, 208, 240, .35) 34%,
      rgba(180, 172, 220, .14) 60%, rgba(180, 172, 220, 0) 100%);
    mix-blend-mode: screen; pointer-events: none;
    opacity: 0; transition: opacity .2s ease;
  }
  .hs:hover::after, .hs:focus-visible::after { opacity: var(--gi, 1); }
  @media (prefers-reduced-motion: reduce) { .hs::after { transition: none; } }

  #toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1b1b24; border: 1px solid #34343f; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; color: #eee;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 50;
  }


  /* ─── キャラクター(スケッチ準拠: マユは右向き / パッチは左向き) ─── */
  #mayu {
    position: absolute; left: 88px; top: 112px;
    width: 30px; height: 72px;
    background-image: url(mayu_right_shaded.png);
    background-repeat: no-repeat; background-size: 360px 72px;
    transform: scale(.75); transform-origin: 50% 100%;
    animation: mayuchar 1.2s steps(12) infinite;
  }
  @keyframes mayuchar { from { background-position: 0 0; } to { background-position: -360px 0; } }
  #mshadow {
    position: absolute; left: 93px; top: 180px;
    width: 20px; height: 5px;
    border-radius: 50%; background: rgba(64, 24, 108, .5);
  }
  /* おばけなので、ふわりと浮き沈みする */
  #pattifloat {
    position: absolute; left: 262px; top: 136px; width: 32px; height: 48px;
    animation: pattifloat 3.1s ease-in-out infinite;
  }
  @keyframes pattifloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
  @media (prefers-reduced-motion: reduce) { #pattifloat { animation: none; } }
  #patti {
    position: absolute; left: 0; top: 0;
    width: 32px; height: 48px;
    background-image: url(patti_right_shaded.png);
    background-repeat: no-repeat; background-size: 384px 48px;
    /* 原本の left タグは顔が枠で切れているので、Right を左右反転して左を向かせる */
    transform: scale(.75) scaleX(-1); transform-origin: 50% 100%;
    animation: pattichar 1.2s steps(12) infinite;
  }
  @keyframes pattichar { from { background-position: 0 0; } to { background-position: -384px 0; } }
  #pshadow {
    position: absolute; left: 268px; top: 180px;
    width: 20px; height: 5px;
    border-radius: 50%; background: rgba(64, 24, 108, .5);
  }
  @media (prefers-reduced-motion: reduce) { #patti, #mayu { animation: none; } }

  /* ─── スマホ(縦持ち)への案内(TOPと同じ) ─── */
  #rotate {
    position: fixed; inset: 0; z-index: 100; display: none;
    flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    background: #05030f; padding: 24px;
    font-family: 'DotGothic16', 'MS Gothic', monospace; text-align: center;
  }
  #rotate .phone {
    width: 144px; height: 144px; image-rendering: pixelated;
    background-image: url(rotate_phone.png);
    background-size: 1440px 144px;
    animation: phoneturn 2.6s steps(1) infinite;
  }
  @keyframes phoneturn {
    0%,9.9%    { background-position: 0 0; }
    10%,19.9%  { background-position: -144px 0; }
    20%,29.9%  { background-position: -288px 0; }
    30%,39.9%  { background-position: -432px 0; }
    40%,49.9%  { background-position: -576px 0; }
    50%,59.9%  { background-position: -720px 0; }
    60%,69.9%  { background-position: -864px 0; }
    70%,79.9%  { background-position: -1008px 0; }
    80%,89.9%  { background-position: -1152px 0; }
    90%,100%   { background-position: -1296px 0; }
  }
  #rotate .msg {
    position: relative; max-width: 340px; box-sizing: border-box;
    background: rgba(8, 6, 40, .92);
    border: 2px solid #e8e4f4; border-radius: 3px;
    box-shadow: inset 0 0 0 1px #2a2560;
    padding: 13px 12px 12px 54px; color: #f2eefc;
    font-size: clamp(11px, 3.4vw, 14px); line-height: 1.7; text-align: left;
    white-space: nowrap;
  }
  #rotate .msg b {
    color: #fcc800; font-weight: normal; display: block;
    font-size: clamp(12px, 3.9vw, 16px); margin-bottom: 2px;
  }
  #rotate .patti {
    position: absolute; left: 8px; bottom: 6px;
    width: 36px; height: 48px; image-rendering: pixelated;
    background-image: url(patti_shaded.png);
    background-size: 2160px 48px;
    animation: pattiidle 1.2s steps(12) infinite;
  }
  @keyframes pattiidle { from { background-position: 0 0; } to { background-position: -432px 0; } }
  #rotate .anyway {
    background: none; border: 0; color: #8b86a8;
    font-family: inherit; font-size: 12px; text-decoration: underline;
    cursor: pointer; padding: 6px 10px;
  }
  @media (orientation: portrait) and (max-width: 900px) {
    body:not(.seeanyway) #rotate { display: flex; }
  }
  @media (prefers-reduced-motion: reduce) {
    #rotate .phone, #rotate .patti { animation: none; }
    #rotate .phone { background-position: -1296px 0; }
  }

  /* ─── 光の中を舞うチリ(空気感) ─── */
  #motes {
    position: absolute; left: 0; top: 0; width: 384px; height: 240px;
    pointer-events: none; image-rendering: pixelated;
  }

  /* ─── 貼り紙の拡大表示 ─── */
  #lightbox {
    position: fixed; inset: 0; z-index: 120; display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 4, 20, .93); padding: 3vw; cursor: zoom-out;
  }
  #lightbox.on { display: flex; }
  #lightbox img {
    max-width: 96%; max-height: 88%; image-rendering: auto;
    border: 2px solid #e8e4f4; background: #fff;
  }
  #lightbox .cap {
    position: absolute; left: 0; right: 0; bottom: 3vh; text-align: center;
    font-family: 'DotGothic16', 'MS Gothic', monospace; color: #f2eefc; font-size: 13px;
  }

  /* ─── データの資料ポップアップ(模造紙を拡大したイメージ) ─── */
  #dpop {
    position: fixed; inset: 0; z-index: 130; display: none;
    align-items: center; justify-content: center;
    background: rgba(6, 4, 20, .86); padding: 24px 16px;
  }
  #dpop.on { display: flex; }
  #dpwrap { position: relative; width: min(920px, 94vw); max-height: 88vh; }
  #dpsheet {
    max-height: 88vh; overflow-y: auto;
    background: #efe8d6; color: #241c30;
    border: 3px solid #cdbfa0; box-shadow: 0 10px 0 rgba(0, 0, 0, .35);
    padding: 22px 26px 26px;
    font-family: 'DotGothic16', 'MS Gothic', monospace;
  }
  #dpsheet h2 {
    font-size: 20px; margin: 0 0 4px; letter-spacing: 1px;
    border-bottom: 3px solid #241c30; display: inline-block; padding-bottom: 3px;
  }
  #dpsheet .lead { font-size: 12px; line-height: 1.7; margin: 10px 0 4px; }
  #dpsheet .note {
    font-size: 11px; line-height: 1.7; margin: 8px 0 18px;
    background: #fdf7e6; border-left: 4px solid #d8a13a; padding: 8px 10px;
  }
  #dpsheet h3 {
    font-size: 13px; margin: 20px 0 8px; padding: 3px 8px;
    background: #241c30; color: #efe8d6; display: inline-block;
  }
  #dpsheet ul { list-style: none; margin: 0; padding: 0; }
  #dpsheet li {
    border-bottom: 1px dashed #bdb098; padding: 9px 2px 9px 0;
    display: flex; gap: 12px; align-items: baseline;
  }
  #dpsheet .fig {
    flex: 0 0 132px; font-size: 17px; line-height: 1.25; color: #9c2b4e; font-weight: bold;
  }
  #dpsheet .body { flex: 1 1 auto; }
  #dpsheet .say { font-size: 12px; line-height: 1.65; }
  #dpsheet .src { font-size: 10px; line-height: 1.6; color: #5c5140; margin-top: 3px; }
  #dpsheet .src a { color: #3d5a8c; }
  #dpsheet .rec { color: #b8860b; }
  #dpclose {
    position: absolute; right: 0; top: -30px;
    border: 1px solid #e8e4f4; background: rgba(8, 6, 40, .9);
    color: #f2eefc; font-family: 'DotGothic16', 'MS Gothic', monospace;
    font-size: 13px; padding: 5px 12px; cursor: pointer;
  }
  #dpclose:hover { background: rgba(236, 148, 190, .5); }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <img id="room" src="room_design.png" alt="デザイン室">
    <div id="garblink" aria-hidden="true"></div>
    <div id="doorGlowStudio" aria-hidden="true"></div>

    <button id="doorStudio" class="hs" style="left:344px;top:48px;width:31px;height:168px;--gi:.45"
            aria-label="スタジオ（トップページ）にもどる"></button>

    <div id="ppstory" aria-hidden="true">Story is King</div>
    <button class="pp" id="ppdesign" style="left:56px;top:40px;width:66px;height:38px"
            aria-label="キャラクターデザインと設計"><span>キャラクター<br>デザイン＆設計</span></button>
    <button class="pp" id="ppsketch" style="left:132px;top:44px;width:24px;height:26px"
            aria-label="おばけのラフスケッチ"></button>
    <button class="pp" id="ppspooks" style="left:58px;top:88px;width:74px;height:29px"
            aria-label="Spooks GS（おばけたちの一覧）"><img id="spooksimg"
            src="spooks_gs_paper.jpg" alt=""></button>
    <button class="pp" id="ppworld" style="left:146px;top:128px;width:82px;height:26px"
            aria-label="世界観"><span>世界観</span></button>
    <button class="pp" id="pptale" style="left:196px;top:60px;width:48px;height:34px"
            aria-label="物語"><span>物語</span></button>
    <button class="pp" id="ppdatatitle" style="left:248px;top:42px;width:84px;height:13px;color:#dcecdf"
            aria-label="キャラクターに関するデータ">キャラクターに関するデータ</button>
    <button class="pp" id="ppdata" style="left:248px;top:58px;width:84px;height:96px"
            aria-label="キャラクターに関するデータの資料"></button>

    <canvas id="motes" width="384" height="240" aria-hidden="true"></canvas>
    <div id="mshadow" aria-hidden="true"></div>
    <div id="mayu" role="img" aria-label="マユちゃん"></div>
    <div id="pshadow" aria-hidden="true"></div>
    <div id="pattifloat" aria-hidden="true"><div id="patti" role="img" aria-label="パッチくん"></div></div>

    <div id="navbar">
      <div class="brand" id="brandhome" role="link" tabindex="0" aria-label="トップページへ"><img src="nav_logo.png" alt="STUDIO PATTI"></div>
      <nav>
        <button data-k="company">COMPANY</button>
        <button data-k="chdesign" class="here">CHARACTER<br>DESIGN</button>
        <button data-k="contents">CONTENTS<br>CREATIVE</button>
        <button data-k="spook">Patti the Spook</button>
        <button data-k="contact">CONTACT US</button>
      </nav>
    </div>
    <div id="talkbox">
      <span class="name">パッチ</span>
      <span id="talktext">ここはデザイン室！<br>キャラクターをデザインして、世界と物語まで設計するよ！</span>
      <span class="cursor" aria-hidden="true"></span>
    </div>
  </div>
</div>

<div id="rotate" role="dialog" aria-label="画面を横向きにしてください">
  <div class="phone" aria-hidden="true"></div>
  <div class="msg">
    <div class="patti" aria-hidden="true"></div>
    <b>スマホを横向きにしてね！</b>
    よこにすると、<br>デザイン室が<br>ぜんぶ見えるよ！
  </div>
  <button class="anyway" type="button">このまま見る</button>
</div>
<div id="toast"></div>
<div id="lightbox" role="dialog" aria-label="拡大表示">
  <img id="lbimg" src="" alt="">
  <div class="cap">クリックでとじる</div>
</div>

<div id="dpop" role="dialog" aria-label="キャラクターに関するデータ">
  <div id="dpwrap">
    <button id="dpclose" type="button" aria-label="とじる">× とじる</button>
    <div id="dpsheet"></div>
  </div>
</div>
<script>
const COMPANY_URL = 'https://canva.link/5xu274fv1b00091';
const stage = document.getElementById('stage');
const talktext = document.getElementById('talktext');
const TALK_DEFAULT = 'ここはデザイン室！<br>キャラクターをデザインして、世界と物語まで設計するよ！';
const setTalk = t => { talktext.innerHTML = t; };

function fitStage() {
  const s = Math.max(0.5, Math.min(window.innerWidth / 384, window.innerHeight / 240));
  stage.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitStage);
window.addEventListener('load', fitStage);
if (window.ResizeObserver) new ResizeObserver(fitStage).observe(document.documentElement);
document.addEventListener('visibilitychange', fitStage);
setTimeout(fitStage, 400);
fitStage();

function tease(name) {
  setTalk('「' + name + '」は いま準備中！<br>たのしみに待っててね！');
  clearTimeout(window._tz);
  window._tz = setTimeout(() => setTalk(TALK_DEFAULT), 3400);
}
function hoverTalk(el, text) {
  el.addEventListener('mouseenter', () => setTalk(text));

// ─── 光の中を舞うチリ。光源に近いほど明るく見える(空気感) ───
const MOTE_LIGHTS = [[112, 24, 74], [258, 24, 74], [360, 118, 66]];
const MOTE_BOT = 146;
(() => {
  const cv = document.getElementById('motes');
  if (!cv) return;
  const g = cv.getContext('2d');
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ms = [];
  for (let i = 0; i < 34; i++) {
    ms.push({ x: Math.random() * 384, y: 16 + Math.random() * (MOTE_BOT - 16),
              vx: (Math.random() - 0.5) * 3.2, vy: -1.6 - Math.random() * 2.4,
              ph: Math.random() * Math.PI * 2, sp: 0.5 + Math.random() * 1.1 });
  }
  const draw = (dt, t) => {
    g.clearRect(0, 0, 384, 240);
    for (const m of ms) {
      m.x += m.vx * dt; m.y += m.vy * dt;
      if (m.y < 14) { m.y = MOTE_BOT; m.x = Math.random() * 384; }
      if (m.x < -2) m.x = 386; else if (m.x > 386) m.x = -2;
      let best = 0;
      for (const L of MOTE_LIGHTS) {
        const d = Math.hypot(m.x - L[0], m.y - L[1]);
        if (d < L[2]) best = Math.max(best, 1 - d / L[2]);
      }
      if (best < 0.06) continue;
      const a = best * (0.55 + 0.45 * Math.sin(t * m.sp + m.ph));
      if (a < 0.12) continue;
      g.fillStyle = 'rgba(255,232,180,' + (a * 0.9) + ')';
      g.fillRect(Math.round(m.x), Math.round(m.y), 1, 1);
    }
  };
  if (still) { draw(0, 0); return; }
  let prev = 0, acc = 0;
  const tick = (ts) => {
    requestAnimationFrame(tick);
    if (!prev) prev = ts;
    const dt = Math.min(0.1, (ts - prev) / 1000); prev = ts;
    if (document.hidden) return;
    acc += dt;
    if (acc < 1 / 14) return;
    draw(acc, ts / 1000); acc = 0;
  };
  requestAnimationFrame(tick);
})();

const dpop = document.getElementById('dpop');
const dpsheet = document.getElementById('dpsheet');
function buildDataSheet() {
  if (dpsheet.dataset.built) return;
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;');
  let h = '<h2>キャラクターに関するデータ</h2>'
        + '<p class="lead">企業や自治体が、若い人材に届き、選ばれるために。'
        + 'キャラクターとアニメーションが「あった方がいいもの」ではなく「必要なもの」である理由を、公的統計と調査データで。</p>'
        + '<p class="note">※これは仮のボードです。★はスタジオパッチのおすすめ。'
        + 'ここから載せるものを選んでいただければ、出典つきで黒板に清書します。</p>';
  DATA_SECTIONS.forEach(sec => {
    h += '<h3>' + esc(sec.h) + '</h3><ul>';
    sec.items.forEach(it => {
      h += '<li><div class="fig">' + (it.rec ? '<span class="rec">★</span> ' : '') + esc(it.fig) + '</div>'
         + '<div class="body"><div class="say">' + esc(it.say) + '</div>'
         + '<div class="src">出典: ' + esc(it.src)
         + ' <a href="' + it.url + '" target="_blank" rel="noopener">[リンク]</a></div></div></li>';
    });
    h += '</ul>';
  });
  dpsheet.innerHTML = h;
  dpsheet.dataset.built = '1';
}
function openDataPop() { buildDataSheet(); dpop.classList.add('on'); dpsheet.scrollTop = 0; }
function closeDataPop() { dpop.classList.remove('on'); }
document.getElementById('dpclose').addEventListener('click', closeDataPop);
dpop.addEventListener('click', e => { if (e.target === dpop) closeDataPop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDataPop(); });
['ppdata', 'ppdatatitle'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('click', openDataPop);
});
